android {
    namespace 'roro.stellar.manager'
    defaultConfig {
        applicationId "roro.stellar.manager"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildFeatures {
        buildConfig true
        prefab true
        compose true
    }

    def signingPropsFile = rootProject.file("signing.properties")
    def signingProps = new Properties()
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def hasReleaseSigning = [
            "KEYSTORE_FILE",
            "KEYSTORE_PASSWORD",
            "KEYSTORE_ALIAS",
            "KEYSTORE_ALIAS_PASSWORD"
    ].every { signingProps.getProperty(it)?.trim() } &&
            rootProject.file(signingProps.getProperty("KEYSTORE_FILE", "")).exists()

    signingConfigs {
        sign {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProps.getProperty("KEYSTORE_FILE"))
                storePassword signingProps.getProperty("KEYSTORE_PASSWORD")
                keyAlias signingProps.getProperty("KEYSTORE_ALIAS")
                keyPassword signingProps.getProperty("KEYSTORE_ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.sign : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.22.1+"
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/**']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    kotlin {
        jvmToolchain(21)
    }
}

// Flutter 引擎把 libflutter.so 发成普通 jar。AGP 会拿去 dex，debug so 直接撑爆堆。
// 先从运行时配置抽出 so，再把 jar 排除出 dex。
def flutterAbis = [
        armeabi_v7a: 'armeabi-v7a',
        arm64_v8a  : 'arm64-v8a',
        x86_64     : 'x86_64',
]
tasks.register('extractFlutterJni') {
    def outDir = layout.buildDirectory.dir('flutter-jni')
    def cache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1/io.flutter')
    inputs.dir(cache).optional()
    outputs.dir(outDir)
    doLast {
        def root = outDir.get().asFile
        root.deleteDir()
        flutterAbis.each { artifact, abi ->
            def moduleDir = new File(cache, "${artifact}_debug")
            def jar = moduleDir.exists() ? fileTree(moduleDir).matching { include '**/*.jar' }.files.find { true } : null
            if (jar == null) throw new GradleException("missing Flutter native jar: ${artifact}_debug")
            copy {
                from(zipTree(jar)) { include 'lib/**/*.so' }
                into(new File(root, abi))
            }
        }
    }
}
afterEvaluate {
    android.sourceSets.debug.jniLibs.srcDir(layout.buildDirectory.dir('flutter-jni'))
    tasks.matching { it.name == 'mergeDebugJniLibFolders' }.configureEach { dependsOn('extractFlutterJni') }
    configurations.matching { it.name.toLowerCase().contains('debug') }.configureEach {
        flutterAbis.keySet().each { abi ->
            exclude group: 'io.flutter', module: "${abi}_debug"
        }
    }
}

autoResConfig {
    generatedClassFullName = "roro.stellar.manager.StellarLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}
def collapseReleaseResourceNames = task('collapseReleaseResourceNames').doLast {
    def aapt2 = Paths.get(project.android.sdkDirectory.path, 'build-tools', project.android.buildToolsVersion, 'aapt2')
    def zip = Paths.get(project.buildDir.path, 'intermediates',
            'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
    def optimized = new File("${zip}.opt")
    def cmd = exec {
        commandLine aapt2, 'optimize', '--collapse-resource-names',
                '--resources-config-path', 'aapt2-resources.cfg',
                '-o', optimized, zip
        ignoreExitValue false
    }
    if (cmd.exitValue == 0) {
        delete(zip)
        optimized.renameTo("$zip")
    }
}
afterEvaluate {
    tasks.findByName('optimizeReleaseResources')?.finalizedBy(collapseReleaseResourceNames)
}
android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "stellar-v${variant.versionName}-${variant.name}.apk"

        variant.assembleProvider.get().doLast {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath

            if (variant.getBuildType().isMinifyEnabled()) {
                copy {
                    from variant.mappingFileProvider.get()
                    into mappingDir
                    rename { String fileName -> "mapping-${variant.versionName}.txt" }
                }
                copy {
                    from outputFile
                    into apkDir
                }
            }
        }
    }
}
tasks.withType(CompileArtProfileTask.class).configureEach {
    enabled = false
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.window' && details.requested.name == 'window-java') {
            details.useVersion('1.2.0')
            details.because('Flutter embedding requests 1.2.0; 1.5.0 is not in the offline cache')
        }
    }
}
